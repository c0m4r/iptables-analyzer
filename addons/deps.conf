# Supply-chain cooldown for Go module updates.
#
# A module version must have been published at least COOLDOWN_DAYS days ago
# before addons/update-deps.sh adopts it and before CI accepts it. Most
# malicious releases are found and withdrawn within days; waiting keeps them
# out of the build. Override per run with --cooldown DAYS or the
# GO_DEPS_COOLDOWN_DAYS environment variable; 0 disables the cooldown.
#
# Keep the cooldown in .github/dependabot.yml at the same value:
# addons/check-deps-cooldown.sh fails when they differ.
COOLDOWN_DAYS=7

# Reviewed exceptions: versions accepted before their cooldown ends, for
# example urgent fixes. One COOLDOWN_EXCEPTION=module@version per line with
# the reason; an exception covers that exact version only.
COOLDOWN_EXCEPTION=github.com/xo/terminfo@v1.3.1 # adopted 2026-11-09; fixes two crashes in Decode (eligible from 2026-11-11)
